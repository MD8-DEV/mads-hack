# Demo founder brief for a deliberately weak idea (input written by the team member acting as founder).
title: Lefty Walls - weekly wallpapers for left-handed people
idea: >
  A USD 4 per month subscription that emails left-handed people a new AI-generated desktop
  wallpaper every week, with the visual weight placed on the left side of the screen.
customer: Left-handed people who use a computer every day, starting with university students in Cairo
why_you: We can generate images with free open models and run a weekly email ourselves.
jurisdiction: Egypt
budget: USD 0 cash
time: About 3 hours per week
evidence: None. Two friends said it sounds fun; nobody has paid or signed up.
values: Honest marketing, no dark patterns.
